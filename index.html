
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تابلو برق متحد</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101923;color:white;
 font-family:Tahoma,Arial,sans-serif;
 text-align:center
}
.container{max-width:520px;margin:auto;padding:22px}
.logo{
 width:100px;height:100px;border:2px solid #f5a623;
 border-radius:50%;display:flex;align-items:center;
 justify-content:center;margin:12px auto;
 font-size:48px;background:#263747
}
.brand{font-size:27px;font-weight:bold;margin:14px 0}
.english{color:#f5a623;letter-spacing:3px;font-size:12px}
.hero{
 margin:25px 0;border-radius:16px;min-height:190px;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#263747,#101923);
 border:1px solid #40505d;font-size:76px
}
.desc{line-height:2;color:#d6e0e8;font-size:14px}
.slogan{
 margin:25px 0;padding:17px 8px;
 background:#1d2b38;border-radius:12px;
 display:flex;justify-content:center;gap:9px;flex-wrap:wrap
}
.word{font-size:17px;color:white}
.word b{color:#f5a623;font-size:22px}
h3{margin-top:30px}
.links{
 display:grid;grid-template-columns:1fr 1fr;gap:12px
}
.link{
 padding:15px 7px;border-radius:12px;
 color:white;text-decoration:none;font-size:14px;
 background:#263747;border:1px solid #40505d
}
.icon{font-size:23px;display:block;margin-bottom:7px}
.phone{background:#167a55}
.whatsapp{background:#167a55}
.telegram{background:#2676a8}
.instagram{background:#a74775}
.bale{background:#2676a8}
.eitaa{background:#d77c22}
.rubika{background:#6b58a5}
footer{color:#9aabb9;font-size:12px;margin:30px 0 10px}
</style>
</head>
<body>
<div class="container">

<div class="logo">⚙️</div>
<div class="brand">تابلو برق متحد</div>
<div class="english">MOTTAHED PANEL</div>

<div class="hero">⚡</div>

<p class="desc">
سازنده انواع تابلوهای برق فشار قوی و ضعیف،
صنعتی و اتوماسیون صنعتی
</p>

<div class="slogan">
<span class="word"><b>م</b>هارت</span>
<span class="word"><b>ت</b>جربه</span>
<span class="word"><b>ح</b>رفه</span>
<span class="word"><b>د</b>انش</span>
</div>

<h3>راه‌های ارتباطی با ما</h3>

<div class="links">
<a class="link phone" href="tel:">
<span class="icon">☎️</span>تماس تلفنی
</a>
<a class="link" href="sms:">
<span class="icon">✉️</span>ارسال پیامک
</a>
<a class="link whatsapp" href="#">
<span class="icon">🟢</span>واتساپ
</a>
<a class="link telegram" href="#">
<span class="icon">✈️</span>تلگرام
</a>
<a class="link instagram" href="#">
<span class="icon">◎</span>اینستاگرام
</a>
<a class="link bale" href="#">
<span class="icon">✓</span>بله
</a>
<a class="link eitaa" href="#">
<span class="icon">✦</span>ایتا
</a>
<a class="link rubika" href="#">
<span class="icon">✿</span>روبیکا
</a>
</div>

<footer>
تابلو برق متحد | مهارت، تجربه، حرفه، دانش
</footer>

</div>
</body>
</html>
